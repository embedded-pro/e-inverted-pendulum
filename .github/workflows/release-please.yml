---
name: Create Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  release_please:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ vars.FOREST_RELEASER_APP_ID }}
          private-key: ${{ secrets.FOREST_RELEASER_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.token.outputs.token }}

  build_host:
    name: Build Host Package
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: "host"
          buildPreset: "host-Release-WithPackage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-install-package
          path: build/host/inverted_pendulum_bot-*.*
          if-no-files-found: error

  build_embedded:
    name: Build Embedded (${{ matrix.target }})
    needs: [release_please, build_host]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["NUCLEO-WB55RG"]
        configuration: ["RelWithDebInfo"]
        gcc: ["13.2.Rel1"]
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install GNU Arm Embedded Toolchain ${{ matrix.gcc }}
        uses: carlosperate/arm-none-eabi-gcc-action@0edbb000a5a98e2292b051b463bff6f512547118 # v1.14.0
        with:
          release: ${{ matrix.gcc }}
      - run: sudo apt-get update && sudo apt-get install ninja-build xsltproc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-install-package
      - run: tar -zxvf inverted_pendulum_bot-*.tar.gz
      - run: mkdir -p install && mv inverted_pendulum_bot-*/* install/ || true
      - uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: ${{ matrix.target }}
          buildPreset: ${{ matrix.target }}-${{ matrix.configuration }}
      - name: Generate hex firmware
        run: |
          find "build/${{ matrix.target }}" -name "*.elf" -path "*/${{ matrix.configuration }}/*" -type f | while read -r elf; do
            hex="${elf%.elf}.hex"
            arm-none-eabi-objcopy -O ihex "$elf" "$hex"
          done
      - name: Package firmware
        run: |
          version="${{ needs.release_please.outputs.tag_name }}"
          staging="staging/${{ matrix.target }}"
          mkdir -p "$staging"
          find "build/${{ matrix.target }}" \( -name "*.elf" -o -name "*.hex" \) -path "*/${{ matrix.configuration }}/*" -type f | while read -r f; do
            cp "$f" "$staging/"
          done
          tar -czf "inverted_pendulum_bot-firmware-${{ matrix.target }}-${version}.tar.gz" -C staging "${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.target }}
          path: inverted_pendulum_bot-firmware-${{ matrix.target }}-*.tar.gz
          if-no-files-found: error

  build_documentation:
    name: Build Documentation
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Generate documentation PDFs and traceability matrix
        uses: embedded-pro/project-documentation@54fca1cb9925af16e53bd9d2640d1285560d295b # v0.2.0
        with:
          run-build-documentation-pdfs: 'true'
          run-traceability-matrix: 'true'
          version: ${{ needs.release_please.outputs.tag_name }}
          output-dir: docs-pdf
          artifact-name: documentation-pdfs
          requirements-dir: documentation/requirements
          features-dir: documentation/use-cases
          matrix-output: docs-pdf/traceability-matrix.md
          matrix-pdf-output: docs-pdf/inverted_pendulum_bot-traceability-matrix-${{ needs.release_please.outputs.tag_name }}.pdf

  publish_release_assets:
    name: Publish Release Assets
    needs:
      [
        release_please,
        build_host,
        build_embedded,
        build_documentation
      ]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Remove host install package
        run: rm -f release-assets/inverted_pendulum_bot-0*.* release-assets/inverted_pendulum_bot-*-Linux.*
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.release_please.outputs.tag_name }}"
          for asset in release-assets/*; do
            [ -f "$asset" ] || continue
            echo "Uploading: $asset"
            gh release upload "$tag" "$asset" --repo "$GH_REPO"
          done
